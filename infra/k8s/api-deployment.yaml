apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-api
  namespace: trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-api
  template:
    metadata:
      labels:
        app: trading-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: trading-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: trading-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: trading-api
  namespace: trading
spec:
  selector:
    app: trading-api
  ports:
    - port: 80
      targetPort: 8000
