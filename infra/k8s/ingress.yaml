apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ingress
  namespace: trading
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
spec:
  rules:
    - host: trading.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: trading-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-ui
                port:
                  number: 80
